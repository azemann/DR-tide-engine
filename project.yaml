schema_version: 3

project:
  name: "DR Tide Engine"
  kind: "TypeScript library with diagnostic CLI and local observatory"
  version: "0.1.0"

components:
  main:
    root: "."
    languages:
      primary: "TypeScript"
      secondary:
        - "JavaScript"
        - "HTML"
        - "CSS"
    toolchain:
      compiler_or_interpreter: "TypeScript compiler (tsc)"
      runtimes:
        - "Node.js >=20"
      dependency_managers:
        - "npm"
      build_tools:
        - "npm scripts"
        - "TypeScript compiler (tsc)"
      frameworks: []
    targets:
      - "Node.js >=20 on Linux, macOS, and Windows"
      - "Modern browser through the local loopback observatory"
    commands:
      install:
        status: defined
        argv: [npm, ci]
      test:
        status: defined
        argv: [npm, test]
      typecheck:
        status: defined
        argv: [npm, run, typecheck]
      build:
        status: defined
        argv: [npm, run, build]
      predict-example:
        status: defined
        argv:
          - npm
          - run
          - --silent
          - predict
          - --
          - --station
          - ticon/ouistreham-311-fra-refmar
          - --date
          - "2026-07-25"
      observatory-data:
        status: defined
        argv:
          - npm
          - run
          - observatory:data
          - --
          - --date
          - "2026-07-25"
    artifacts: []

# Les portées sont indépendantes. Une cible future peut être ajoutée sous
# distribution.intent sans activer de pipeline, secret ou environnement.
delivery:
  scopes:
    development:
      status: active
      execution: manual
      pipelines: []
    release:
      status: deferred
      reason: "À activer lorsqu'un artefact versionné doit être produit et qualifié."
    distribution:
      status: deferred
      reason: "À activer lorsqu'un canal, un store, un registre ou un environnement réel est choisi."
    operation:
      status: deferred
      reason: "À activer lorsqu'un système installé ou en service doit être maintenu."

artifacts: {}
pipelines: {}
environments: {}
secrets: {}

evidence:
  declared_by: "human"
  last_verified: "2026-07-25"
